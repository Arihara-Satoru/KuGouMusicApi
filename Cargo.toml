[package]
name = "kugoumusicapi"
version = "1.6.0"
edition = "2024"

[[bin]]
name = "kugoumusicapi"
path = "rust-src/main.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
dotenvy = "0.15.7"
http = "1.3.1"
md5 = "0.8.0"
png = "0.18.0"
qrcode = { version = "0.14.1", default-features = false }
rand = "0.9.2"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream", "socks", "gzip", "brotli", "deflate", "zstd"] }
rsa = "0.9.8"
rquickjs = { version = "0.12.2", features = ["futures", "parallel"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.143", features = ["preserve_order"] }
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
url = "2.5.7"
uuid = { version = "1.18.0", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
